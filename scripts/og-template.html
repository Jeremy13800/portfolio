<!doctype html>
<!-- Gabarit de l'image de partage (1200x630). Non livré : sert à régénérer public/og-image.jpg.
     Procédure : capture 1200x630 avec un navigateur (voir README), puis conversion JPEG avec sharp. -->
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Instrument Serif"; src: url("../src/fonts/instrument-serif-latin.woff2") format("woff2"); font-style: normal; }
  @font-face { font-family: "Instrument Serif"; src: url("../src/fonts/instrument-serif-italic-latin.woff2") format("woff2"); font-style: italic; }
  @font-face { font-family: "Inter"; src: url("../src/fonts/inter-latin.woff2") format("woff2"); font-weight: 400 600; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #070a12; }
  body { position: relative; color: #e8ecf8; font-family: "Inter", sans-serif; }
  .nebula { position: absolute; inset: 0;
    background: radial-gradient(55% 65% at 80% 10%, rgba(157,123,255,.28), transparent 70%),
                radial-gradient(50% 55% at 5% 40%, rgba(82,113,255,.2), transparent 70%); }
  .planet { position: absolute; left: 66%; top: 480px; width: 1900px; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(ellipse 55% 16% at 50% 0%, rgba(110,140,255,.34), transparent 75%), radial-gradient(circle at 50% 28%, #0f1736 0%, #090d20 42%, #05070f 72%);
    box-shadow: inset 0 2px 0 rgba(205,218,255,.9), inset 0 12px 30px rgba(110,140,255,.5), 0 -6px 30px rgba(120,150,255,.5), 0 -50px 140px rgba(82,113,255,.25); }
  .glint { position: absolute; left: 58%; top: 478px; width: 240px; height: 44px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(255,255,255,.9) 0, rgba(160,185,255,.4) 24%, transparent 66%); }
  .stars { position: absolute; inset: 0; background-image:
    radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 33% 8%, #cfd8ff, transparent),
    radial-gradient(1.5px 1.5px at 52% 22%, #fff, transparent), radial-gradient(1px 1px at 71% 12%, #cfd8ff, transparent),
    radial-gradient(1px 1px at 88% 30%, #fff, transparent), radial-gradient(1px 1px at 22% 44%, #cfd8ff, transparent),
    radial-gradient(1.5px 1.5px at 94% 8%, #ffd9a8, transparent), radial-gradient(1px 1px at 6% 62%, #fff, transparent),
    radial-gradient(1px 1px at 46% 52%, #cfd8ff, transparent), radial-gradient(1px 1px at 79% 55%, #fff, transparent); }
  .content { position: absolute; left: 80px; top: 120px; right: 80px; }
  .tag { font: 500 18px/1 ui-monospace, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; color: #a2acc8; }
  h1 { margin-top: 28px; font: 400 116px/0.95 "Instrument Serif", serif; letter-spacing: -.025em; }
  h1 em { font-style: italic; background: linear-gradient(120deg,#8ea2ff,#b7a0ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .name { margin-top: 30px; font: 400 30px/1.2 "Inter", sans-serif; color: #a2acc8; }
  .name b { color: #e8ecf8; font-weight: 500; }
</style>
</head>
<body>
  <div class="nebula"></div><div class="stars"></div><div class="planet"></div><div class="glint"></div>
  <div class="content">
    <p class="tag">Développeur web · Portfolio</p>
    <h1>Je construis des <em>univers</em><br />pour le web.</h1>
    <p class="name"><b>Jérémy Cailleux</b></p>
  </div>
</body>
</html>
